<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<style>
  *{
    margin:0;
    padding:0;
  }
  .swiper{
    width:100%;
    height:100vh;
    position:relative;
overflow-x:hidden;
    img{
        width:100%;
        height:100%;
        object-fit:cover;
    }
  }
button,button2{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:3rem;
    color:#fff;
    background:transparent;
    border:none;
    cursor:pointer;
  }
  button{
    right:10px;
  }
  button2{
    left:10px;
  }
  


</style>
<body>
    <div class="swiper">
        <img src="./public/Bali.jpg" alt="">
        <img src="./public/Dubai.jpg" alt=""> 
        <img src="./public/Thailand.avif" alt="">
        

        <button><i class="ri-arrow-right-circle-line"></i></button>
        <button2><i class="ri-arrow-left-circle-line"></i></button2>
    </div>

</body>
<script>
    const swiper = document.querySelector('.swiper');
    const images = swiper.querySelectorAll('img');
    const nextBtn = swiper.querySelector('button');
    const prevBtn = swiper.querySelector('button2');

    let currentIndex = 0;

    function showImage(index) {
        images.forEach((img, i) => {
            img.style.display = i === index ? 'block' : 'none';
        });
    }

    nextBtn.addEventListener('click', () => {
        currentIndex = (currentIndex + 1) % images.length;
        showImage(currentIndex);
    });

    prevBtn.addEventListener('click', () => {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage(currentIndex);
    });

    // Initialize the first image
    showImage(currentIndex);
    </script>
</html>
